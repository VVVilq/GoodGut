services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: goodgut
      POSTGRES_USER: goodgut
      POSTGRES_PASSWORD: goodgut-local
    ports:
      - "5432:5432"
    volumes:
      - goodgut-postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U goodgut -d goodgut"]
      interval: 2s
      timeout: 3s
      retries: 20

volumes:
  goodgut-postgres-data:
