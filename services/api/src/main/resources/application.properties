spring.application.name=goodgut-server
goodgut.open-food-facts.base-url=${OPEN_FOOD_FACTS_BASE_URL:https://world.openfoodfacts.org}
goodgut.open-food-facts.user-agent=${OPEN_FOOD_FACTS_USER_AGENT:GoodGut-development/0.1}
goodgut.open-food-facts.connect-timeout=${OPEN_FOOD_FACTS_CONNECT_TIMEOUT:2s}
goodgut.open-food-facts.read-timeout=${OPEN_FOOD_FACTS_READ_TIMEOUT:5s}
server.port=${PORT:8080}
