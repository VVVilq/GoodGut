# Cached Spring contexts must not keep another context's test database alive.
spring.datasource.url=jdbc:h2:mem:goodgut-${random.uuid};MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE;DEFAULT_NULL_ORDERING=HIGH
spring.datasource.username=sa
spring.datasource.password=
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
spring.application.name=goodgut-server
goodgut.open-food-facts.base-url=https://world.openfoodfacts.org
goodgut.open-food-facts.user-agent=GoodGut-tests/0.1
goodgut.open-food-facts.connect-timeout=2s
goodgut.open-food-facts.read-timeout=5s
